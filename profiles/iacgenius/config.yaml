# IaC Genius Community Edition — Hermes profile `iacgenius`.
# Schema version of the pinned Hermes image (v0.23.1); without it Hermes treats the file as pre-v12.
_config_version: 50
model:
  default: __MODEL_NAME__
  provider: custom
  base_url: __MODEL_BASE_URL__
  key_env: MODEL_API_KEY
agent:
  max_turns: 40
display:
  streaming: false
  show_reasoning: false
streaming:
  enabled: false
# The iacg-desk plugin and iacg-board tab are built on the instance from BUILD-BRIEF.md,
# then enabled here. Start empty so the first boot does not reference plugins that do not exist yet.
plugins:
  enabled: []
platform_toolsets:
  cli: [skills, clarify, file]
kanban:
  dispatch_in_gateway: false
  auto_decompose: false
memory:
  memory_enabled: true
  user_profile_enabled: true
skills:
  external_dirs: []